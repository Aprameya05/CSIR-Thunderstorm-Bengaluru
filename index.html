    const API_ENDPOINTS = [

    const getRiskBadge = (prob) => {
      if (prob >= 0.50) return { text: 'CRITICAL RISK', color: 'text-red-500', bg: 'bg-red-500/20', bar: 'bg-red-500' };
      if (prob >= 0.30) return { text: 'HIGH RISK', color: 'text-orange-400', bg: 'bg-orange-500/20', bar: 'bg-orange-400' };
      if (prob >= 0.15) return { text: 'MODERATE RISK', color: 'text-yellow-400', bg: 'bg-yellow-500/20', bar: 'bg-yellow-400' };
      return { text: 'LOW RISK', color: 'text-emerald-400', bg: 'bg-emerald-500/20', bar: 'bg-emerald-400' };
    };

    const getInitialSlotByIstTime = () => {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const ist = new Date(utc + (3600000 * 5.5));
      const hours = ist.getHours();
      if (hours >= 0 && hours < 6) return 0; // Late Night
      if (hours >= 6 && hours < 12) return 1; // Morning
      if (hours >= 12 && hours < 18) return 2; // Afternoon
      return 3; // Evening
    };

    // --- ANIMATED NUMBER COMPONENT ---
    function AnimatedNumber({ value, decimals = 1, suffix = '' }) {
      const [displayValue, setDisplayValue] = useState(0);
      useEffect(() => {
        let start = null;
        const target = parseFloat(value);
        function update(now) {
          if (!start) start = now;
          const progress = Math.min((now - start) / 1200, 1);
          setDisplayValue((1 - Math.pow(1 - progress, 3)) * target);
          if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
      }, [value]);
      return <span className="font-mono">{displayValue.toFixed(decimals)}{suffix}</span>;
    }

    // --- CIRCULAR ARC GAUGE (270 DEGREE SWEEP) ---
    function CircularArcGauge({ probability, threshold = 0.34, size = 110 }) {
      const strokeWidth = 9;
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const maxSweep = 270;
      const strokeDashArray = `${(maxSweep / 360) * circumference} ${circumference}`;
      const fillOffset = (1 - Math.min(Math.max(probability, 0), 1)) * ((maxSweep / 360) * circumference);

      return (
        <div className="relative flex items-center justify-center mx-auto" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="transform rotate-[135deg]">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="#172338" strokeWidth={strokeWidth} strokeDasharray={strokeDashArray} fill="transparent" strokeLinecap="round" />
            <circle cx={size / 2} cy={size / 2} r={radius} stroke={probability >= 0.3 ? '#ef5350' : '#4caf50'} strokeWidth={strokeWidth} strokeDasharray={strokeDashArray} strokeDashoffset={fillOffset} strokeLinecap="round" fill="transparent" style={{ transition: 'stroke-dashoffset 1s ease-out' }} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span className="font-mono text-xl font-extrabold text-white">
              <AnimatedNumber value={probability * 100} decimals={1} suffix="%" />
            </span>
            <span className="text-[9px] font-mono text-[#607d8b] uppercase tracking-wider">
              LIMIT: {(threshold * 100).toFixed(0)}%
            </span>
          </div>
        </div>
      );
    }

    // --- AUROC HALF-CIRCLE GAUGE COMPONENT ---
    function HalfCircleAurocGauge({ value = 0.871, size = 85 }) {
      const strokeWidth = 8;
      const radius = (size - strokeWidth) / 2;
      const circumference = Math.PI * radius;
      const fillOffset = (1 - Math.min(Math.max(value, 0), 1)) * circumference;

      return (
        <div className="relative flex items-center justify-center" style={{ width: size, height: size / 2 + 10 }}>
          <svg width={size} height={size / 2 + 10} className="transform rotate-[180deg]">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="#172338" strokeWidth={strokeWidth} strokeDasharray={`${circumference} ${circumference}`} fill="transparent" strokeLinecap="round" />
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="#4caf50" strokeWidth={strokeWidth} strokeDasharray={`${circumference} ${circumference}`} strokeDashoffset={fillOffset} strokeLinecap="round" fill="transparent" style={{ transition: 'stroke-dashoffset 1s ease-out' }} />
          </svg>
          <div className="absolute bottom-0 text-center font-mono">
            <span className="text-[9px] text-[#607d8b] block font-semibold">AUROC</span>
            <span className="text-sm font-extrabold text-white">{value.toFixed(3)}</span>
          </div>
        </div>
      );
    }

    // --- ATMOSPHERIC WEATHER OVERLAY (NO BLUR LAYERS) ---
    function AtmosphericWeatherOverlay({ selectedSlotIndex }) {
      const [lightningFlash, setLightningFlash] = useState(false);

      // Random Lightning Strike Timer (Every 6.5 seconds)
      useEffect(() => {
        const triggerLightning = () => {
          setLightningFlash(true);
          setTimeout(() => setLightningFlash(false), 220);

        const interval = setInterval(triggerLightning, 6500);
        return () => clearInterval(interval);

      return (

          {/* Brief White-Blue Lightning Flash Overlay */}
          <div className={`absolute inset-0 bg-cyan-100/20 transition-opacity duration-75 ${lightningFlash ? 'opacity-100' : 'opacity-0'}`}></div>

          {lightningFlash && (

    // --- 1. DASHBOARD PAGE ---
    function DashboardOverviewPage({ slots, selectedSlotIndex, onSelectSlot, isLiveData, lastUpdated, liveTime, liveData, onNavTabChange, fetchLatencyMs }) {
      const currentSlot = slots[selectedSlotIndex] || slots[2];
      const photoInfo = SLOT_AIRPORT_PHOTOS[selectedSlotIndex] || SLOT_AIRPORT_PHOTOS[2];
      const riskInfo = getRiskBadge(currentSlot.ts_probability);
      // Peak slot for system-wide alert state (may differ from selected slot)
      const peakSlotData = liveData?.peak_slot !== undefined
        ? (slots.find(s => s.slot === liveData.peak_slot) || currentSlot)
        : slots.reduce((a, b) => a.ts_probability > b.ts_probability ? a : b, currentSlot);
      const systemAlertActive = liveData?.alert_active ?? slots.some(s => s.ts_probability >= 0.30);

      // --- DRIFT DETECTION: Rolling AUROC Monitor ---
      // Stores up to 20 recent AUROC snapshots (from liveData.synoptic_regime.auroc or evaluation_results)
      const [aurocHistory, setAurocHistory] = React.useState(() => {
        try {
          const stored = sessionStorage.getItem('csir_auroc_history');
          return stored ? JSON.parse(stored) : [];
        } catch { return []; }
      });
      const [driftDismissed, setDriftDismissed] = React.useState(false);

      React.useEffect(() => {
        const latestAuroc = liveData?.synoptic_regime?.auroc
          ?? liveData?.model_performance?.auroc
          ?? null;
        if (latestAuroc === null || typeof latestAuroc !== 'number') return;
        setAurocHistory(prev => {
          const ts = Date.now();
          // Deduplicate: only append if >5 min since last entry
          if (prev.length > 0 && ts - prev[prev.length - 1].ts < 5 * 60 * 1000) return prev;
          const next = [...prev, { auroc: latestAuroc, ts }].slice(-20);
          try { sessionStorage.setItem('csir_auroc_history', JSON.stringify(next)); } catch {}
          return next;
        });
        setDriftDismissed(false); // reset dismiss on new data
      }, [liveData?.synoptic_regime?.auroc, liveData?.model_performance?.auroc]);

      // Rolling mean of last 5 snapshots
      const rollingWindow = aurocHistory.slice(-5);
      const rollingAuroc = rollingWindow.length > 0
        ? rollingWindow.reduce((s, x) => s + x.auroc, 0) / rollingWindow.length
        : null;
      const DRIFT_THRESHOLD = 0.75;
      const driftFlagged = rollingAuroc !== null && rollingAuroc < DRIFT_THRESHOLD;


      return (
        <div className="space-y-4 max-w-[1750px] mx-auto">
          

          {/* DRIFT DETECTION ALERT BANNER */}
          {driftFlagged && !driftDismissed && (
            <div className="flex items-center justify-between gap-4 px-4 py-3 rounded-xl border border-amber-500/60 bg-amber-950/30 font-mono text-xs animate-pulse-slow">
              <div className="flex items-center gap-3">
                <span className="text-amber-400 text-lg">&#9888;</span>
                <div>
                  <div className="font-bold text-amber-300 uppercase tracking-wider">
                    MODEL DRIFT DETECTED
                  </div>
                  <div className="text-[10px] text-amber-400/80 mt-0.5">
                    Rolling AUROC (last {rollingWindow.length} checks):
                    <span className="text-white font-bold ml-1">
                      {rollingAuroc !== null ? rollingAuroc.toFixed(3) : '—'}
                    </span>
                    <span className="text-amber-400/60 ml-1">
                      &lt; threshold {DRIFT_THRESHOLD.toFixed(2)}

                        <span className="text-cyan-300">MEAN</span>

                        <span className="text-center text-cyan-300">45</span>

                  </div>
                  <div className="p-4 rounded-xl bg-[#050811] border border-[#172338]">
                    <h4 className="font-bold text-white mb-2 text-xs">CALIBRATION & DATASET SPECIFICATIONS</h4>

                      <div className="flex justify-between"><span>CALIBRATION METHOD</span><span className="text-cyan-300 font-bold">Isotonic (all slots)</span></div>
                      <div className="flex justify-between"><span>TRAINING PERIOD</span><span className="text-white font-bold">2015 – 2022 (8 years)</span></div>
                      <div className="flex justify-between"><span>TESTING PERIOD</span><span className="text-white font-bold">2023 – 2025 (3 years)</span></div>

                      <div className="flex justify-between"><span>STORM EVENTS</span><span className="text-white font-bold">457 days (12.0%)</span></div>
                      <div className="flex justify-between border-t border-[#172338] pt-1.5 mt-1.5"><span className="text-amber-300">OCTOBER NOTE</span><span className="text-amber-300 font-bold">Threshold 0.10 (vs 0.226)</span></div>
                      <div className="text-[9px] text-[#607d8b]">Oct post-monsoon seasonal suppression fix — POD 0.38→0.62</div>

          })()}

    }

    // --- SKEW-T SOUNDING DIAGRAM COMPONENT ---
    function SkewTDiagram({ liveData }) {
      const [sounding, setSounding] = useState(null);
      const [soundingStatus, setSoundingStatus] = useState('idle');
      const [soundingTime, setSoundingTime] = useState('12');

      // Build synthetic sounding from GFS met params already in forecast.json
      const buildGFSSounding = () => {
        const mp = liveData?.met_parameters;
        if (!mp) return null;
        // GFS gives us T at 500/700/850 hPa and surface
        // Build a plausible 6-level sounding
        const t2m  = (mp.ERA5_T2M ?? mp.t2m ?? 300) - 273.15;
        const t850 = (mp.ERA5_t_850hPa ?? mp.t_850) ? (mp.ERA5_t_850hPa ?? mp.t_850) - 273.15 : t2m - 5;
        const t700 = (mp.ERA5_t_700hPa ?? mp.t_700) ? (mp.ERA5_t_700hPa ?? mp.t_700) - 273.15 : t2m - 12;
        const t500 = (mp.ERA5_t_500hPa ?? mp.t_500) ? (mp.ERA5_t_500hPa ?? mp.t_500) - 273.15 : t2m - 25;
        const d2m  = (mp.ERA5_D2M ?? mp.d2m ?? 295) - 273.15;
        const cape = mp.ERA5_CAPE ?? mp.CAPE ?? 0;
        // Dewpoint depression widens with height
        const levels = [
          { p: 1000, t: t2m,       td: d2m },
          { p: 925,  t: t2m - 3,   td: d2m - 4 },
          { p: 850,  t: t850,      td: d2m - 8 },
          { p: 700,  t: t700,      td: d2m - 18 },
          { p: 500,  t: t500,      td: t500 - 20 },
          { p: 300,  t: t500 - 15, td: t500 - 40 },
          { p: 200,  t: t500 - 25, td: t500 - 55 },
        ];
        const now = new Date();
        return {
          levels,
          station: '43295',
          time: `GFS-derived · ${now.toISOString().slice(0,10)}`,
          isFallback: true,
          cape,
        };
      };

      const fetchSounding = async (hour) => {
        setSoundingStatus('loading');
        setSounding(null);
        const now = new Date();
        const yyyy = now.getUTCFullYear();
        const mm   = String(now.getUTCMonth() + 1).padStart(2, '0');
        const dd   = String(now.getUTCDate()).padStart(2, '0');
        const url  = `https://weather.uwyo.edu/cgi-bin/bufrraob.py?datetime=${yyyy}-${mm}-${dd}+${hour}%3A00%3A00&id=43295&type=json`;
        const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        try {
          const res = await fetch(proxy);
          if (!res.ok) throw new Error('proxy error');
          const outer = await res.json();
          const data = JSON.parse(outer.contents);
          const levels = [];
          if (data && data.mandatory) {
            for (const lvl of data.mandatory) {
              if (lvl.pressure && lvl.temperature !== null && lvl.dewpoint !== null) {
                levels.push({ p: lvl.pressure, t: lvl.temperature, td: lvl.dewpoint, h: lvl.height || null });
              }
            }
          }
          if (levels.length < 3) throw new Error('no data');
          setSounding({ levels, station: '43295', time: `${yyyy}-${mm}-${dd} ${hour}Z` });
          setSoundingStatus('ok');
        } catch(e) {
          // Use GFS fallback from forecast.json
          const fallback = buildGFSSounding();
          if (fallback) {
            setSounding(fallback);
            setSoundingStatus('gfs-fallback');
          } else {
            setSoundingStatus('error');
          }
        }
      };

      useEffect(() => { fetchSounding(soundingTime); }, [soundingTime]);

      // SVG Skew-T rendering
      // Pressure levels: 1000→100 hPa, log scale
      // Temperature: skewed 45° to the right
      const W = 520, H = 480;
      const MARGIN = { top: 20, right: 20, bottom: 30, left: 50 };
      const PW = W - MARGIN.left - MARGIN.right;
      const PH = H - MARGIN.top - MARGIN.bottom;
      const P_TOP = 100, P_BOT = 1050;
      const T_LEFT = -50, T_RIGHT = 50; // °C range

      const pToY = (p) => MARGIN.top + PH * (Math.log(P_BOT) - Math.log(p)) / (Math.log(P_BOT) - Math.log(P_TOP));
      const tToX = (t, p) => {
        // Skew: shift right by (log(P_BOT)-log(p)) * skew_factor
        const skew = (Math.log(P_BOT) - Math.log(p)) / (Math.log(P_BOT) - Math.log(P_TOP)) * PW * 0.5;
        return MARGIN.left + (t - T_LEFT) / (T_RIGHT - T_LEFT) * PW + skew;
      };

      // Dry adiabat lines (θ = const, T = θ*(P/1000)^0.286)
      const dryAdiabats = [-20, 0, 20, 40];
      const moistAdiabats = [10, 20, 30];
      const isoBars = [1000, 925, 850, 700, 500, 400, 300, 200, 150, 100];
      const isoTherms = [-50, -40, -30, -20, -10, 0, 10, 20, 30, 40];

      // Build sounding path strings
      const buildPath = (pts) => pts.length < 2 ? '' :
        pts.map((pt, i) => `${i===0?'M':'L'}${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(' ');

      const tempPath = sounding ? buildPath(
        sounding.levels.filter(l => l.p <= P_BOT && l.p >= P_TOP)
          .map(l => ({ x: tToX(l.t, l.p), y: pToY(l.p) }))
      ) : '';

      const dewPath = sounding ? buildPath(
        sounding.levels.filter(l => l.p <= P_BOT && l.p >= P_TOP && l.td !== null)
          .map(l => ({ x: tToX(l.td, l.p), y: pToY(l.p) }))
      ) : '';

      // Key levels
      const lcl = sounding?.levels?.find(l => l.p <= 900 && l.t - l.td < 3);
      const lfc = sounding?.levels?.find(l => l.p <= (lcl?.p || 900) && l.t <= l.td + 1);

      return (
        <div className="p-4 rounded-xl bg-[#020409] border border-cyan-500/20 font-mono">
          <div className="flex justify-between items-center mb-3 border-b border-[#172338] pb-2">
            <span className="text-xs font-bold text-cyan-300 flex items-center gap-2">
              <span className={`w-2 h-2 rounded-full ${soundingStatus==='ok' ? 'bg-emerald-400' : soundingStatus==='loading' ? 'bg-amber-400 animate-pulse' : soundingStatus==='gfs-fallback' ? 'bg-orange-400' : 'bg-gray-500'}`}></span>
              SKEW-T LOG-P ATMOSPHERIC SOUNDING — BENGALURU 43295 · Full atmospheric column · independent of slot selection
              {soundingStatus==='gfs-fallback' && <span className="text-orange-400 text-[9px] ml-2">(GFS SYNTHETIC — RADIOSONDE UNAVAILABLE)</span>}
              {soundingStatus==='ok' && <span className="text-emerald-400 text-[9px] ml-2">(LIVE RADIOSONDE)</span>}
            </span>
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-[#607d8b]">Univ. of Wyoming · BUFR Radiosonde</span>
              <button onClick={() => setSoundingTime('00')} className={`px-2 py-1 rounded text-[10px] font-bold border ${soundingTime==='00' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50' : 'bg-[#050811] text-[#607d8b] border-[#172338]'}`}>00Z</button>
              <button onClick={() => setSoundingTime('12')} className={`px-2 py-1 rounded text-[10px] font-bold border ${soundingTime==='12' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50' : 'bg-[#050811] text-[#607d8b] border-[#172338]'}`}>12Z</button>
              <button onClick={() => fetchSounding(soundingTime)} className="px-2 py-1 rounded text-[10px] font-bold border bg-[#050811] text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/10">↻ REFRESH</button>
            </div>
          </div>

          {soundingStatus === 'loading' && (
            <div className="h-48 flex items-center justify-center text-[#607d8b] text-xs">
              Fetching radiosonde data from University of Wyoming...
            </div>
          )}

          {(soundingStatus === 'ok' || soundingStatus === 'gfs-fallback') && sounding && (
            <div className="flex gap-4">
              <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="flex-shrink-0" style={{maxWidth:'100%'}}>
                {/* Background */}
                <rect x={MARGIN.left} y={MARGIN.top} width={PW} height={PH} fill="rgba(2,4,9,0.95)" />

                {/* Isobars (horizontal lines) */}
                {isoBars.map(p => {
                  const y = pToY(p);
                  return (
                    <g key={p}>
                      <line x1={MARGIN.left} y1={y} x2={MARGIN.left+PW} y2={y} stroke="#172338" strokeWidth={p===1000||p===500?"1.5":"0.8"} />
                      <text x={MARGIN.left-4} y={y+3} fill="#607d8b" fontSize="9" textAnchor="end" fontFamily="monospace">{p}</text>
                    </g>
                  );
                })}

                {/* Isotherms (skewed vertical lines) */}
                {isoTherms.map(t => {
                  const x1 = tToX(t, P_BOT);
                  const x2 = tToX(t, P_TOP);
                  const isZero = t === 0;
                  return (
                    <g key={t}>
                      <line x1={x1} y1={MARGIN.top+PH} x2={x2} y2={MARGIN.top} stroke={isZero?"rgba(100,180,255,0.5)":"rgba(23,35,56,0.9)"} strokeWidth={isZero?"1.5":"0.8"} strokeDasharray={isZero?"":"3 3"} />
                      <text x={x1} y={MARGIN.top+PH+12} fill={isZero?"#38bdf8":"#607d8b"} fontSize="9" textAnchor="middle" fontFamily="monospace">{t}°</text>
                    </g>
                  );
                })}

                {/* Dry adiabats */}
                {dryAdiabats.map(th => {
                  const pts = isoBars.map(p => {
                    const t = (th + 273.15) * Math.pow(p/1000, 0.286) - 273.15;
                    return { x: tToX(t, p), y: pToY(p) };
                  }).filter(pt => pt.x >= MARGIN.left && pt.x <= MARGIN.left+PW);
                  return <path key={th} d={buildPath(pts)} fill="none" stroke="rgba(255,152,0,0.25)" strokeWidth="0.8" />;
                })}

                {/* Temperature profile — RED */}
                {tempPath && <path d={tempPath} fill="none" stroke="#ef5350" strokeWidth="2.5" strokeLinejoin="round" />}

                {/* Dewpoint profile — GREEN */}
                {dewPath && <path d={dewPath} fill="none" stroke="#4caf50" strokeWidth="2.5" strokeLinejoin="round" />}

                {/* CAPE shading between T and Td above LFC */}
                {sounding && lfc && (
                  <path
                    d={buildPath(
                      sounding.levels
                        .filter(l => l.p <= lfc.p && l.p >= P_TOP)
                        .map(l => ({ x: tToX(l.t, l.p), y: pToY(l.p) }))
                    ) + ' ' + buildPath(
                      sounding.levels
                        .filter(l => l.p <= lfc.p && l.p >= P_TOP)
                        .reverse()
                        .map(l => ({ x: tToX(l.td || l.t - 5, l.p), y: pToY(l.p) }))
                    ) + ' Z'}
                    fill="rgba(239,83,80,0.12)"
                    stroke="none"
                  />
                )}

                {/* LCL marker */}
                {lcl && (
                  <g>
                    <line x1={MARGIN.left} y1={pToY(lcl.p)} x2={MARGIN.left+PW} y2={pToY(lcl.p)} stroke="rgba(255,235,59,0.4)" strokeWidth="1" strokeDasharray="4 3" />
                    <text x={MARGIN.left+PW-2} y={pToY(lcl.p)-3} fill="#ffc107" fontSize="8" textAnchor="end" fontFamily="monospace">LCL {lcl.p}hPa</text>
                  </g>
                )}

                {/* LFC marker */}
                {lfc && (
                  <g>
                    <line x1={MARGIN.left} y1={pToY(lfc.p)} x2={MARGIN.left+PW} y2={pToY(lfc.p)} stroke="rgba(239,83,80,0.5)" strokeWidth="1" strokeDasharray="4 3" />
                    <text x={MARGIN.left+PW-2} y={pToY(lfc.p)-3} fill="#ef5350" fontSize="8" textAnchor="end" fontFamily="monospace">LFC {lfc.p}hPa</text>
                  </g>
                )}

                {/* Border */}
                <rect x={MARGIN.left} y={MARGIN.top} width={PW} height={PH} fill="none" stroke="#172338" strokeWidth="1.5" />

                {/* Axis label */}
                <text x={MARGIN.left + PW/2} y={H-2} fill="#607d8b" fontSize="9" textAnchor="middle" fontFamily="monospace">TEMPERATURE (°C) — SKEWED 45°</text>
                <text x={12} y={MARGIN.top + PH/2} fill="#607d8b" fontSize="9" textAnchor="middle" fontFamily="monospace" transform={`rotate(-90,12,${MARGIN.top+PH/2})`}>PRESSURE (hPa)</text>
              </svg>

              {/* Right panel — key values */}
              <div className="flex-1 space-y-2 text-[10px]">
                <div className="text-[9px] text-emerald-400 font-bold mb-2">{sounding.time} · Station 43295</div>

                {/* Legend */}
                <div className="flex gap-3 mb-3">
                  <span className="flex items-center gap-1"><span className="inline-block w-6 h-1 bg-red-400 rounded"></span> Temperature</span>
                  <span className="flex items-center gap-1"><span className="inline-block w-6 h-1 bg-green-400 rounded"></span> Dewpoint</span>
                </div>

                {/* Level table */}
                <div className="space-y-1">
                  <div className="grid grid-cols-3 text-[9px] text-[#607d8b] border-b border-[#172338] pb-1 font-bold">
                    <span>PRES (hPa)</span><span>TEMP (°C)</span><span>DEWP (°C)</span>
                  </div>
                  {sounding.levels.filter(l => [1000,925,850,700,500,300].includes(Math.round(l.p/25)*25) || [1000,925,850,700,500,300].includes(l.p)).slice(0,8).map((l,i) => (
                    <div key={i} className="grid grid-cols-3 text-[10px] border-b border-[#172338]/50 py-0.5">
                      <span className="text-cyan-300 font-bold">{Math.round(l.p)}</span>
                      <span className={l.t > 0 ? 'text-red-400' : 'text-blue-300'}>{l.t?.toFixed(1)}</span>
                      <span className="text-green-400">{l.td?.toFixed(1)}</span>
                    </div>
                  ))}
                </div>

                {/* Key derived indices */}
                <div className="mt-3 space-y-1 border-t border-[#172338] pt-2">
                  {lcl && <div className="flex justify-between"><span className="text-[#607d8b]">LCL</span><span className="text-yellow-400 font-bold">{lcl.p} hPa</span></div>}
                  {lfc && <div className="flex justify-between"><span className="text-[#607d8b]">LFC</span><span className="text-red-400 font-bold">{lfc.p} hPa</span></div>}
                  <div className="flex justify-between"><span className="text-[#607d8b]">850 hPa T</span><span className="text-white font-bold">{sounding.levels.find(l=>l.p<=870&&l.p>=830)?.t?.toFixed(1) ?? '—'}°C</span></div>
                  <div className="flex justify-between"><span className="text-[#607d8b]">500 hPa T</span><span className="text-white font-bold">{sounding.levels.find(l=>l.p<=520&&l.p>=480)?.t?.toFixed(1) ?? '—'}°C</span></div>
                  <div className="flex justify-between"><span className="text-[#607d8b]">Lapse Rate</span>
                    <span className="text-white font-bold">{(() => {
                      const t850 = sounding.levels.find(l=>l.p<=870&&l.p>=830)?.t;
                      const t500 = sounding.levels.find(l=>l.p<=520&&l.p>=480)?.t;
                      return (t850 && t500) ? `${((t850-t500)/3.5).toFixed(1)} °C/km` : '—';
                    })()}</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {soundingStatus === 'error' && (
            <div className="h-24 flex items-center justify-center text-red-400 text-xs">
              Could not fetch sounding or build GFS fallback. Try refreshing.
            </div>
          )}
        </div>
      );
    }

    // --- 4. EXPLAINABILITY PAGE (SHAP BARS + RAG TERMINAL) ---
    function ExplainabilityPage({ liveData }) {
      const [shapSlot, setShapSlot] = useState(2);
      const [ragQuery, setRagQuery] = useState('');
      const [ragLogs, setRagLogs] = useState(
        `System ready. Connect to /rag/explain endpoint to activate Llama-3.3 powered meteorological explanation. Ask: Why did Slot 2 fire today?`
      );

      // Real-time SHAP — computed inside component so liveData is in scope
      const DERIVED_FEATURES_RT = new Set(['cape_x_kindex','li_x_totals','thetae_850','q_gradient_500_850','wind_shear_500_850','wind_shear_700_850','moisture_flux_850','moisture_flux_700','thickness_500_850','mid_level_drying']);
      const realtimeShap = liveData?.realtime_shap?.[String(shapSlot)];
      const isRealtime = !!realtimeShap?.top_features;
      const maxShap = isRealtime ? Math.max(...realtimeShap.top_features.map(f => Math.abs(f.shap)), 0.01) : 0.85;
      const SHAP_DATA = isRealtime ? realtimeShap.top_features.map(f => ({
          feature: f.feature,
          value: Math.abs(f.shap),
          raw_shap: f.shap,
          isDerived: DERIVED_FEATURES_RT.has(f.feature),
          direction: f.direction,
          actual_value: f.value,
        })) : SHAP_DATA_FALLBACK;

      const handleRunQuery = async (e) => {
        e.preventDefault();
        const query = ragQuery || 'Why did Slot 2 fire today?';
        const today = new Date().toISOString().split('T')[0];
        setRagLogs(`[RAG EXPLAINABILITY LOG — ENDPOINT /rag/explain]:\nQuery: "${query}"\n\nConnecting to Llama-3.3 engine...`);
        try {
          const res = await fetch('https://csir-thunderstorm-api.onrender.com/rag/explain', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: query, date: today })
          });
          if (!res.ok) throw new Error(`API error: ${res.status}`);
          const data = await res.json();
          setRagLogs(
            `[RAG EXPLAINABILITY LOG — ENDPOINT /rag/explain]:\n` +
            `Query: "${query}"\n\n` +
            `${data.explanation || data.response || data.answer || JSON.stringify(data, null, 2)}`
          );
        } catch (err) {

    // --- 6. LIVE API PAGE (FASTAPI ENDPOINTS DISPLAY) ---
    function LiveApiPage({ liveData }) {
      const [responses, setResponses] = useState({});
      const [loading, setLoading] = useState({});
      const [elapsed, setElapsed] = useState({});
      const [apiStatus, setApiStatus] = useState(null);
      const API_BASE = 'https://csir-thunderstorm-api.onrender.com';
      const TIMEOUT_MS = 90000;

      useEffect(() => {
        const controller = new AbortController();
        fetch(`${API_BASE}/`, { method: 'GET', signal: controller.signal })
          .then(r => r.ok ? setApiStatus('online') : setApiStatus('waking'))
          .catch(() => setApiStatus('waking'));
        return () => controller.abort();
      }, []);

      const handleTryIt = async (ep) => {
        if (ep.isPost) return;
        const key = ep.path;
        setLoading(prev => ({ ...prev, [key]: true }));
        setResponses(prev => ({ ...prev, [key]: null }));
        setElapsed(prev => ({ ...prev, [key]: 0 }));

        const startTime = Date.now();
        const timer = setInterval(() => {
          setElapsed(prev => ({ ...prev, [key]: Math.floor((Date.now() - startTime) / 1000) }));
        }, 1000);

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

        try {
          const res = await fetch(`${API_BASE}${ep.path}`, { method: 'GET', signal: controller.signal });
          const data = await res.json();
          setApiStatus('online');
          setResponses(prev => ({ ...prev, [key]: { ok: true, status: res.status, data, ms: Date.now() - startTime } }));
        } catch (err) {
          const isTimeout = err.name === 'AbortError';
          setResponses(prev => ({ ...prev, [key]: {
            ok: false,
            status: isTimeout ? 'TIMEOUT' : 'ERROR',
            data: { error: isTimeout ? 'Request timed out (90s). Render is cold-starting — wait 30s and try again.' : err.message }
          }}));
        } finally {
          clearTimeout(timeoutId);
          clearInterval(timer);
          setLoading(prev => ({ ...prev, [key]: false }));
        }
      };

      return (
        <div className="atc-card p-6 rounded-2xl font-mono space-y-6 max-w-[1750px] mx-auto">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-[#172338] pb-4">
            <div>
              <h2 className="text-xl font-bold text-white">FASTAPI OPERATIONAL NOWCASTING ENDPOINTS</h2>
              <p className="text-xs text-[#607d8b]">REST API Interface for Airport Ground Handling & Automated Systems</p>
            </div>
            <div className="flex items-center gap-2 w-full sm:w-auto">
              <span className={`w-2 h-2 rounded-full flex-shrink-0 ${apiStatus === 'online' ? 'bg-emerald-400' : apiStatus === 'waking' ? 'bg-amber-400 animate-pulse' : 'bg-gray-500'}`}></span>
              <span className="text-[10px] text-[#607d8b] flex-shrink-0">{apiStatus === 'online' ? 'API ONLINE' : apiStatus === 'waking' ? 'API WAKING UP…' : 'CHECKING…'}</span>
              <input
                type="text"
                readOnly
                value="https://csir-thunderstorm-api.onrender.com"
                className="bg-[#050811] text-xs text-[#607d8b] border border-[#172338] rounded px-3 py-1.5 w-full sm:w-80"
              />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {API_ENDPOINTS.map(ep => {
              const key = ep.path;
              const resp = responses[key];
              const isLoading = loading[key];
              const canTry = !ep.isPost;
              return (
                <div key={key} className="p-4 rounded-xl bg-[#050811] border border-[#172338] flex flex-col space-y-3">
                  <div className="flex items-center gap-3">
                    <span className={`px-2.5 py-1 rounded text-xs font-bold ${ep.isPost ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-sky-500/20 text-sky-300 border border-sky-500/40'}`}>
                      {ep.method}
                    </span>
                    <span className="text-xs font-bold text-white font-mono">{ep.path}</span>
                  </div>

                  <p className="text-xs text-[#90a4ae]">{ep.desc}</p>

                  <div className="flex justify-end border-t border-[#172338] pt-2">
                    <button
                      onClick={() => handleTryIt(ep)}
                      disabled={!canTry || isLoading}
                      className={`px-3 py-1.5 rounded text-xs font-bold border transition-all ${
                        !canTry
                          ? 'bg-[#080d1a] text-[#607d8b] border-[#172338] cursor-not-allowed opacity-50'
                          : isLoading
                            ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/40 cursor-wait'
                            : 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40 hover:bg-cyan-500/30 cursor-pointer'
                      }`}
                    >
                      {!canTry ? 'POST — needs body' : isLoading ? `⟳ ${elapsed[key] || 0}s… ${elapsed[key] > 15 ? '(API waking)' : 'Calling...'}` : '▶ Try it'}
                    </button>
                  </div>

                  {/* Response panel */}
                  {resp && (
                    <div className={`rounded-lg p-3 text-[10px] font-mono border max-h-48 overflow-y-auto ${
                      resp.ok ? 'bg-emerald-950/30 border-emerald-500/30 text-emerald-300' : 'bg-red-950/30 border-red-500/30 text-red-300'
                    }`}>
                      <div className="text-[9px] text-[#607d8b] mb-1">{resp.ok ? `${resp.status} OK · ${resp.ms}ms` : resp.status} · {new Date().toLocaleTimeString('en-IN', {timeZone:'Asia/Kolkata'})} IST</div>
                      <pre className="whitespace-pre-wrap break-all">{JSON.stringify(resp.data, null, 2).slice(0, 1200)}{JSON.stringify(resp.data).length > 1200 ? '\n… (truncated)' : ''}</pre>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- 7. RADAR MAP PAGE (DOPPLER RADAR DISPLAY) ---
    function RadarMapPage({ liveData }) {
      const [scrubberTime, setScrubberTime] = useState(4);
      const [isPlaying, setIsPlaying] = useState(false);

      // ---- LIGHTNING FEED STATE ----
      const [strikes, setStrikes] = useState([]);          // [{x,y,lat,lng,age,dist,id}]
      const [strikeCount1h, setStrikeCount1h] = useState(0);
      const [strikeRate, setStrikeRate] = useState(0);     // strikes/min last 5 min
      const [lightningWs, setLightningWs] = useState(null);
      const [wsStatus, setWsStatus] = useState('CONNECTING'); // CONNECTING|LIVE|OFFLINE
      const strikeBuffer = React.useRef([]);               // rolling 1h buffer
      const strikeIdRef = React.useRef(0);

      // VOBL centre (lat/lng) and map geometry
      const VOBL_LAT = 13.1986, VOBL_LON = 77.7066;
      const MAP_CX = 400, MAP_CY = 300;
      const KM_PER_PX = 200 / 240;   // 200 km radius = 240px on 800x600 viewBox

      // Convert lat/lng to SVG x,y
      const latLngToXY = (lat, lng) => {
        const dLat = lat - VOBL_LAT;
        const dLon = lng - VOBL_LON;
        const km_y = dLat * 111.0;
        const km_x = dLon * 111.0 * Math.cos(VOBL_LAT * Math.PI / 180);
        const px_x = MAP_CX + km_x / KM_PER_PX;
        const px_y = MAP_CY - km_y / KM_PER_PX;
        return { x: px_x, y: px_y };
      };

      const distKm = (lat, lng) => {
        const dLat = (lat - VOBL_LAT) * Math.PI / 180;
        const dLon = (lng - VOBL_LON) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(VOBL_LAT*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;
        return 6371 * 2 * Math.asin(Math.sqrt(a));
      };

      // Age strikes every second, prune >5min old from display
      useEffect(() => {
        const ageTimer = setInterval(() => {
          const now = Date.now();
          // Prune display strikes older than 5 min
          setStrikes(prev => prev.filter(s => now - s.ts < 300000).map(s => ({...s, age: now - s.ts})));
          // Prune buffer older than 1h
          strikeBuffer.current = strikeBuffer.current.filter(s => now - s.ts < 3600000);
          setStrikeCount1h(strikeBuffer.current.length);
          // Rate: strikes in last 5 min / 5
          const last5 = strikeBuffer.current.filter(s => now - s.ts < 300000).length;
          setStrikeRate((last5 / 5).toFixed(1));
        }, 1000);
        return () => clearInterval(ageTimer);
      }, []);

      // WebSocket connection to Blitzortung
      useEffect(() => {
        let ws;
        let reconnectTimer;

        const connect = () => {
          // Blitzortung public WebSocket servers (server 9 covers Asia)
          // Use our Render proxy — wss:// so it works from https pages
          const url = 'wss://csir-thunderstorm-api.onrender.com/ws/lightning';
          try {
            ws = new WebSocket(url);
            ws.onopen = () => {
              setWsStatus('LIVE');
              // Proxy handles bbox subscription and filtering server-side
            };
            ws.onmessage = (evt) => {
              try {
                const d = JSON.parse(evt.data);
                // Blitzortung sends: {time, lat, lon, alt, pol, mds, mcg, status, region, delay, sig}
                if (d.lat === undefined || d.lon === undefined) return;
                const lat = d.lat / 1e6;  // Blitzortung uses microdegrees
                const lng = d.lon / 1e6;
                const dist = distKm(lat, lng);
                if (dist > 250) return; // Only within 250 km
                const pos = latLngToXY(lat, lng);
                if (pos.x < 0 || pos.x > 800 || pos.y < 0 || pos.y > 600) return;
                const now = Date.now();
                const id = ++strikeIdRef.current;
                const strike = { id, lat, lng, x: pos.x, y: pos.y, ts: now, age: 0, dist: Math.round(dist) };
                strikeBuffer.current.push(strike);
                setStrikes(prev => [...prev.slice(-200), strike]); // keep last 200 visible
              } catch(e) {}
            };
            ws.onerror = () => setWsStatus('OFFLINE');
            ws.onclose = () => {
              setWsStatus('OFFLINE');
              reconnectTimer = setTimeout(connect, 8000); // reconnect after 8s
            };
          } catch(e) {
            setWsStatus('OFFLINE');
            reconnectTimer = setTimeout(connect, 8000);
          }
        };

        connect();
        return () => {
          if (ws) ws.close();
          clearTimeout(reconnectTimer);
        };
      }, []);

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setScrubberTime(prev => (prev + 1) % 5);
          }, 1200);
        }
        return () => clearInterval(interval);
      }, [isPlaying]);

      return (
        <div className="atc-card p-6 rounded-2xl font-mono max-w-[1750px] mx-auto space-y-4">
          <div className="flex justify-between items-center border-b border-[#172338] pb-4">
            <div>
              <h2 className="text-lg font-bold text-white">DOPPLER RADAR VOBL BENGALURU — S-BAND DISPLAY</h2>
              <p className="text-xs text-[#607d8b]">Coverage Radius: 200 km · 12.97° N, 77.58° E</p>
            </div>
            <span className="px-3 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold">
              HIMAWARI-9 IR ACTIVE — DOPPLER RADAR PENDING IMD ACCESS
            </span>
          </div>

          {/* Himawari-9 Satellite Storm Proximity Panel */}
          {(() => {
            const h9 = liveData?.satellite?.himawari9;
            const stormDetected = h9?.storm_detected;
            const minBT = h9?.min_bt_50km;
            const voblBT = h9?.vobl_bt_celsius;
            const coldPx = h9?.cold_pixels_count ?? 0;
            const nearestKm = h9?.nearest_pixel_dist_km;
            const timestampIST = h9?.timestamp_ist?.replace('T', ' ') + ' IST';
            const available = h9?.available;

            return (
              <div className={`p-4 rounded-xl border font-mono ${stormDetected ? 'bg-red-500/10 border-red-500/40' : 'bg-[#020409] border-[#172338]'}`}>
                <div className="flex justify-between items-center mb-3 border-b border-[#172338] pb-2">
                  <span className="text-xs font-bold text-cyan-300 flex items-center gap-2">
                    <span className={`w-2 h-2 rounded-full ${stormDetected ? 'bg-red-400 animate-ping' : available ? 'bg-emerald-400' : 'bg-gray-500'}`}></span>

                    { label: 'TEMPERATURE', value: liveData?.metar?.temp_c != null ? `${liveData.metar.temp_c}°C` : '—' },
                    { label: 'REL. HUMIDITY', value: liveData?.metar?.rh_pct != null ? `${liveData.metar.rh_pct.toFixed(0)}%` : '—' },
                    { label: 'CAPE', value: liveData?.met_parameters?.ua_cape_jkg != null ? `${liveData.met_parameters.ua_cape_jkg} J/kg` : (liveData?.met_parameters?.CAPE != null ? `${liveData.met_parameters.CAPE.toFixed(0)} J/kg` : '—') },
                    { label: 'K-INDEX', value: liveData?.met_parameters?.ua_k_index ?? liveData?.met_parameters?.K_INDEX?.toFixed(1) ?? '—' },
                    { label: 'LIFTED INDEX', value: liveData?.met_parameters?.ua_lifted_index ?? liveData?.met_parameters?.LIFTED_INDEX?.toFixed(2) ?? '—' },
                    { label: 'TOTALS-TOTALS', value: liveData?.met_parameters?.ua_totals_totals ?? liveData?.met_parameters?.TOTALS_TOTALS?.toFixed(1) ?? '—' },
                  ].map(item => (
                    <div key={item.label} className="p-3 rounded-xl bg-[#050811] border border-[#172338]">
                      <span className="text-[9px] text-[#607d8b] block font-bold">{item.label}</span>
                      <span className="text-base font-extrabold text-white">{item.value}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Flight category + METAR */}
              <div className="rounded-2xl atc-card p-4 flex items-center justify-between">
                <div>
                  <div className="text-[9px] text-[#607d8b] font-bold">FLIGHT CATEGORY</div>
                  <div className={`text-2xl font-extrabold ${fcColor}`}>{flightCat}</div>
                  <div className="text-[9px] text-[#607d8b] mt-0.5">VOBL · METAR</div>
                </div>
                <div className="text-right">
                  <div className="text-[9px] text-[#607d8b] font-bold">S-BAND RADAR</div>
                  <div className="text-sm font-bold text-white">BENGALURU ACTIVE</div>
                  <div className="text-[9px] text-[#607d8b]">CSIR/IMD STATION 43295</div>
                </div>
              </div>
            </div>

            {/* Right: situational awareness */}
            <div className="col-span-3 flex flex-col gap-3">

              {/* Monsoon phase */}
              <div className="rounded-2xl atc-card p-4">
                <div className="text-[9px] text-[#607d8b] font-bold mb-2">MONSOON PHASE</div>
                <div className={`text-xl font-extrabold ${phaseColor}`}>
                  {monsoonPhase ?? liveData?.synoptic_regime?.regime_name ?? 'DETECTING...'}
                </div>
                {monsoonIndex !== null && (
                  <div className="text-[9px] text-[#607d8b] mt-1">
                    Index: <span className="text-white font-bold">{typeof monsoonIndex === 'number' ? monsoonIndex.toFixed(2) : monsoonIndex}</span>
                  </div>
                )}
                <div className="text-[9px] text-[#607d8b] mt-0.5">
                  {liveData?.synoptic_regime?.description ?? ''}
                </div>
              </div>

              {/* Himawari state */}
              <div className={`rounded-2xl atc-card p-4 ${stormDetected ? 'border-orange-500/50' : ''}`}>
                <div className="text-[9px] text-[#607d8b] font-bold mb-2">HIMAWARI-9 SATELLITE</div>
                <div className={`text-base font-extrabold ${stormDetected ? 'text-orange-400 animate-pulse' : 'text-emerald-400'}`}>
                  {stormDetected ? '⚡ STORM DETECTED' : '✓ CLEAR'}
                </div>
                <div className="mt-2 space-y-0.5 text-[9px]">
                  <div className="flex justify-between">
                    <span className="text-[#607d8b]">MIN BT (50km)</span>
                    <span className={`font-bold ${minBT !== null && minBT < -40 ? 'text-red-400' : 'text-white'}`}>
                      {minBT !== null ? `${minBT.toFixed(1)}°C` : '—'}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-[#607d8b]">COLD PIXELS</span>
                    <span className={`font-bold ${coldPx >= 50 ? 'text-orange-400' : 'text-white'}`}>{coldPx}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-[#607d8b]">OVERRIDE</span>
                    <span className={`font-bold ${isSatOverride ? 'text-orange-400' : 'text-emerald-400'}`}>
                      {isSatOverride ? 'ACTIVE' : 'INACTIVE'}
                    </span>
                  </div>
                </div>
              </div>

              {/* All slots summary */}
              <div className="rounded-2xl atc-card p-4 flex-1">
                <div className="text-[9px] text-[#607d8b] font-bold mb-2">ALL SLOTS</div>
                <div className="space-y-2">
                  {slots && slots.map(s => {
                    const isActive = s.slot === currentSlot.slot;
                    const exceeded = s.ts_probability >= s.threshold;
                    return (
                      <div key={s.slot} className={`flex items-center justify-between p-2 rounded-lg ${
                        isActive ? 'bg-cyan-500/15 border border-cyan-500/40' : 'bg-[#050811] border border-[#172338]'
                      }`}>
                        <div>
                          <div className={`text-[9px] font-bold ${isActive ? 'text-cyan-300' : 'text-[#607d8b]'}`}>
                            {isActive ? '▶ ' : ''}{s.label}
                          </div>
                          <div className="text-[8px] text-[#607d8b]">{s.time}</div>
                        </div>
                        <div className={`text-sm font-extrabold ${
                          exceeded ? 'text-red-400' : s.ts_probability >= 0.15 ? 'text-amber-400' : 'text-emerald-400'
                        }`}>
                          {(s.ts_probability * 100).toFixed(1)}%
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          {/* ── Footer ── */}
          <div className="px-8 py-3 border-t border-[#172338] flex justify-between items-center text-[10px] text-[#607d8b]">
            <span>FULLSCREEN ATC VIEW · PRESS ESC OR CLICK BUTTON ABOVE TO EXIT</span>
            <button onClick={onExitAtc} className="text-cyan-400 font-bold hover:text-cyan-300">EXIT ATC VIEW ✖</button>
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [liveData, setLiveData] = useState(null);
      const [isLiveData, setIsLiveData] = useState(false);
      const [lastUpdated, setLastUpdated] = useState('');
      const [fetchLatencyMs, setFetchLatencyMs] = useState(null);
      const [currentSlots, setCurrentSlots] = useState(DEFAULT_SLOTS);
      const [selectedSlotIndex, setSelectedSlotIndex] = useState(() => getInitialSlotByIstTime());
      const [liveTime, setLiveTime] = useState('');
      const [activeNavTab, setActiveNavTab] = useState('DASHBOARD');
      const [isAtcMode, setIsAtcMode] = useState(false);

      // Fetch forecast telemetry
      const fetchRealForecast = async () => {
        try {
          const t0 = performance.now();
          const res = await fetch('./forecast.json');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const latency = performance.now() - t0;
          setFetchLatencyMs(Math.round(latency));
          setLiveData(json);
          setLastUpdated(json.generated_at || json.date || 'Just now');
          setIsLiveData(true);
          if (Array.isArray(json.slots)) {
            setCurrentSlots(json.slots.map(s => ({
              slot: s.slot,
              label: s.label.toUpperCase(),
              time: s.time,
              ts_probability: s.ts_probability,
              ts_predicted: s.ts_predicted,
              threshold: s.threshold,
              icon: s.slot === 0 ? "🌙" : s.slot === 1 ? "☀️" : s.slot === 2 ? "⛅" : "🌆"
            })));
            // Auto-select peak slot when alert is active (override or model)
            if (json.alert_active && json.peak_slot !== undefined && json.peak_slot !== null) {
              setSelectedSlotIndex(json.peak_slot);
            }
          }
        } catch (err) {
          setIsLiveData(false);
          setLastUpdated('2026-07-25 17:20 IST');
          setCurrentSlots(DEFAULT_SLOTS);
        }
      };

      useEffect(() => {
        fetchRealForecast();
        const interval = setInterval(fetchRealForecast, 300000);
        return () => clearInterval(interval);
      }, []);

      // IST Clock Ticker
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          const ist = new Date(utc + (3600000 * 5.5));
          setLiveTime(ist.toLocaleTimeString('en-US', { hour12: false }) + ' IST');
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      const handleNavTabClick = (tab) => {
        setActiveNavTab(tab);
        if (tab === 'ATC VIEW') setIsAtcMode(true);
        else setIsAtcMode(false);
      };

      const handleExitAtc = () => {
        setIsAtcMode(false);
        setActiveNavTab('DASHBOARD');
      };

      return (
        <div className="min-h-screen text-[#e8eaf6] relative">
          
          {/* Fix 1 & Fix 5: ALL 4 SLOT BACKGROUND DIVS RENDERED IN DOM WITH 1s OPACITY TRANSITION */}
          <div 
            className="slot-bg-common"
            style={{
              backgroundImage: `url('./night1.png')`,
              opacity: selectedSlotIndex === 0 ? 1 : 0
            }}
          />
          <div 
            className="slot-bg-common"
            style={{
              backgroundImage: `url('./morning1.png')`,
              opacity: selectedSlotIndex === 1 ? 1 : 0
            }}
          />
          <div 
            className="slot-bg-common"
            style={{
              backgroundImage: `url('./afternoon1.png')`,
              opacity: selectedSlotIndex === 2 ? 1 : 0
            }}
          />
          <div 
            className="slot-bg-common"
            style={{
              backgroundImage: `url('./evening1.png')`,
              opacity: selectedSlotIndex === 3 ? 1 : 0
            }}
          />

          {/* Fix 2: ONE Overlay div only — rgba(0, 0, 0, 0.20) maximum, no bg-black, no blur */}
          <div className="overlay"></div>

          {/* REAL-TIME ATMOSPHERIC WEATHER OVERLAY (LIGHTNING, RAIN, STARS — NO BLUR) */}
          <AtmosphericWeatherOverlay selectedSlotIndex={selectedSlotIndex} />

          {/* Foreground UI Content Container */}
          <div className="relative z-20 flex flex-col min-h-screen">
            
            {/* Header Bar */}
            <HeaderBar 
              liveTime={liveTime} 
              isLiveData={isLiveData} 
              activeNavTab={activeNavTab}
              onNavTabChange={handleNavTabClick}
            />

            {/* Main Content Area */}
            <main className="flex-1 px-4 lg:px-6 pt-10 lg:pt-12 pb-8 overflow-x-hidden">
              <AnimatePresence mode="wait">
                {activeNavTab === 'DASHBOARD' && (
                  <motion.div key="dash" initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -10 }} transition={{ duration: 0.25 }}>
                    <DashboardOverviewPage 
                      slots={currentSlots}
                      selectedSlotIndex={selectedSlotIndex}
                      onSelectSlot={setSelectedSlotIndex}
                      isLiveData={isLiveData}
                      lastUpdated={lastUpdated}
                      liveTime={liveTime}
                      liveData={liveData}
                      onNavTabChange={handleNavTabClick}
                      fetchLatencyMs={fetchLatencyMs}
                    />
                  </motion.div>
                )}

                {activeNavTab === 'FORECAST' && (
                  <motion.div key="forecast" initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -10 }} transition={{ duration: 0.25 }}>
                    <ForecastPage 
                      slots={currentSlots}
                      selectedSlotIndex={selectedSlotIndex}
                      onSelectSlot={setSelectedSlotIndex}
                      liveData={liveData}
                    />
                  </motion.div>
                )}

                {activeNavTab === 'RADAR MAP' && <RadarMapPage key="radar" liveData={liveData} />}
                {activeNavTab === 'MODELS' && <ModelsPage key="models" liveData={liveData} />}
                {activeNavTab === 'EXPLAINABILITY' && <ExplainabilityPage key="explain" liveData={liveData} />}
                {activeNavTab === 'REGIMES' && <RegimesPage key="regimes" liveData={liveData} />}
                {activeNavTab === 'LIVE API' && <LiveApiPage key="api" liveData={liveData} />}
              </AnimatePresence>
            </main>

          </div>

          {/* Fullscreen ATC Mode Overlay */}
          {isAtcMode && (
            <AtcViewFullscreen 
              slots={currentSlots}
              currentSlot={currentSlots[selectedSlotIndex]} 
              onExitAtc={handleExitAtc}
              liveData={liveData}
            />
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
