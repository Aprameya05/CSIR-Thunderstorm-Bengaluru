    };

    const getInitialSlotByIstTime = () => {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const ist = new Date(utc + (3600000 * 5.5));
      const hours = ist.getHours();
      if (hours >= 0 && hours < 6) return 0; // Late Night
      if (hours >= 6 && hours < 12) return 1; // Morning
      if (hours >= 12 && hours < 18) return 2; // Afternoon
      return 3; // Evening
    };

    // --- ANIMATED NUMBER COMPONENT ---
    function AnimatedNumber({ value, decimals = 1, suffix = '' }) {
      const [displayValue, setDisplayValue] = useState(0);
      useEffect(() => {
        let start = null;
        const target = parseFloat(value);
        function update(now) {
          if (!start) start = now;
          const progress = Math.min((now - start) / 1200, 1);
          setDisplayValue((1 - Math.pow(1 - progress, 3)) * target);
          if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
      }, [value]);
      return <span className="font-mono">{displayValue.toFixed(decimals)}{suffix}</span>;
    }

    // --- CIRCULAR ARC GAUGE (270 DEGREE SWEEP) ---
    function CircularArcGauge({ probability, threshold = 0.34, size = 110 }) {
      const strokeWidth = 9;
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const maxSweep = 270;
      const strokeDashArray = `${(maxSweep / 360) * circumference} ${circumference}`;
      const fillOffset = (1 - Math.min(Math.max(probability, 0), 1)) * ((maxSweep / 360) * circumference);

      return (
        <div className="relative flex items-center justify-center mx-auto" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="transform rotate-[135deg]">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="#172338" strokeWidth={strokeWidth} strokeDasharray={strokeDashArray} fill="transparent" strokeLinecap="round" />
            <circle cx={size / 2} cy={size / 2} r={radius} stroke={probability >= 0.3 ? '#ef5350' : '#4caf50'} strokeWidth={strokeWidth} strokeDasharray={strokeDashArray} strokeDashoffset={fillOffset} strokeLinecap="round" fill="transparent" style={{ transition: 'stroke-dashoffset 1s ease-out' }} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span className="font-mono text-xl font-extrabold text-white">
              <AnimatedNumber value={probability * 100} decimals={1} suffix="%" />
            </span>
            <span className="text-[9px] font-mono text-[#607d8b] uppercase tracking-wider">
              LIMIT: {(threshold * 100).toFixed(0)}%
            </span>
          </div>
        </div>
      );
    }

    // --- AUROC HALF-CIRCLE GAUGE COMPONENT ---
    function HalfCircleAurocGauge({ value = 0.871, size = 85 }) {
      const strokeWidth = 8;
      const radius = (size - strokeWidth) / 2;
      const circumference = Math.PI * radius;
      const fillOffset = (1 - Math.min(Math.max(value, 0), 1)) * circumference;

      return (
        <div className="relative flex items-center justify-center" style={{ width: size, height: size / 2 + 10 }}>
          <svg width={size} height={size / 2 + 10} className="transform rotate-[180deg]">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="#172338" strokeWidth={strokeWidth} strokeDasharray={`${circumference} ${circumference}`} fill="transparent" strokeLinecap="round" />
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="#4caf50" strokeWidth={strokeWidth} strokeDasharray={`${circumference} ${circumference}`} strokeDashoffset={fillOffset} strokeLinecap="round" fill="transparent" style={{ transition: 'stroke-dashoffset 1s ease-out' }} />
          </svg>
          <div className="absolute bottom-0 text-center font-mono">
            <span className="text-[9px] text-[#607d8b] block font-semibold">AUROC</span>
            <span className="text-sm font-extrabold text-white">{value.toFixed(3)}</span>
          </div>
        </div>
      );
    }

        `System ready. Connect to /rag/explain endpoint to activate Llama-3.3 powered meteorological explanation. Ask: Why did Slot 2 fire today?`
      );

      // Real-time SHAP — computed inside component so liveData is in scope
      const DERIVED_FEATURES_RT = new Set(['cape_x_kindex','li_x_totals','thetae_850','q_gradient_500_850','wind_shear_500_850','wind_shear_700_850','moisture_flux_850','moisture_flux_700','thickness_500_850','mid_level_drying']);
      const realtimeShap = liveData?.realtime_shap?.[String(shapSlot)];
      const isRealtime = !!realtimeShap?.top_features;
      const maxShap = isRealtime ? Math.max(...realtimeShap.top_features.map(f => Math.abs(f.shap)), 0.01) : 0.85;
      const SHAP_DATA = isRealtime ? realtimeShap.top_features.map(f => ({
          feature: f.feature,
          value: Math.abs(f.shap),
          raw_shap: f.shap,
          isDerived: DERIVED_FEATURES_RT.has(f.feature),
          direction: f.direction,
          actual_value: f.value,
        })) : SHAP_DATA_FALLBACK;

      const handleRunQuery = async (e) => {
        e.preventDefault();
        const query = ragQuery || 'Why did Slot 2 fire today?';
        const today = new Date().toISOString().split('T')[0];
        setRagLogs(`[RAG EXPLAINABILITY LOG — ENDPOINT /rag/explain]:\nQuery: "${query}"\n\nConnecting to Llama-3.3 engine...`);
        try {
          const res = await fetch('https://csir-thunderstorm-api.onrender.com/rag/explain', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: query, date: today })
          });
          if (!res.ok) throw new Error(`API error: ${res.status}`);
          const data = await res.json();
          setRagLogs(
            `[RAG EXPLAINABILITY LOG — ENDPOINT /rag/explain]:\n` +
            `Query: "${query}"\n\n` +
            `${data.explanation || data.response || data.answer || JSON.stringify(data, null, 2)}`
          );

          setRagLogs(
            `[RAG EXPLAINABILITY LOG — ENDPOINT /rag/explain]:\n` +
            `Query: "${query}"\n\n` +
            `[ERROR] Could not reach API: ${err.message}\n` +
            `Check: https://csir-thunderstorm-api.onrender.com/docs`

                ● LIVE SHAP — computed from today's GFS inputs ({realtimeShap?.computed_at})
              </div>
            )}
            {SHAP_DATA.map(item => (
              <div key={item.feature} className="flex items-center gap-3">
                <div className="w-48 text-[#90a4ae] font-medium truncate">{item.feature}</div>
                <div className="flex-1 bg-[#050811] h-6 rounded border border-[#172338] relative overflow-hidden flex items-center px-3">
                  <div
                    className="absolute inset-y-0 left-0 rounded transition-all duration-700"
                    style={{
                      width: `${(item.value / maxShap) * 100}%`,
                      backgroundColor: isRealtime
                        ? (item.direction === 'increases_risk' ? '#ef5350' : '#38bdf8')
                        : (item.isDerived ? '#ef5350' : '#38bdf8')
                    }}
                  />
                  <span className="relative z-10 text-white font-bold ml-auto">
                    {isRealtime ? (item.raw_shap > 0 ? '+' : '') + item.raw_shap?.toFixed(4) : item.value.toFixed(3)}

                {isRealtime && item.actual_value !== undefined && (

    // --- MAIN APP COMPONENT ---
    function App() {
      const [liveData, setLiveData] = useState(null);
      const [isLiveData, setIsLiveData] = useState(false);
      const [lastUpdated, setLastUpdated] = useState('');
      const [currentSlots, setCurrentSlots] = useState(DEFAULT_SLOTS);
      const [selectedSlotIndex, setSelectedSlotIndex] = useState(() => getInitialSlotByIstTime());

      const [activeNavTab, setActiveNavTab] = useState('DASHBOARD');
      const [isAtcMode, setIsAtcMode] = useState(false);

      // Fetch forecast telemetry
      const fetchRealForecast = async () => {
        try {
          const res = await fetch('./forecast.json');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          setLiveData(json);
          setLastUpdated(json.generated_at || json.date || 'Just now');
          setIsLiveData(true);
          if (Array.isArray(json.slots)) {
            setCurrentSlots(json.slots.map(s => ({
              slot: s.slot,
              label: s.label.toUpperCase(),
              time: s.time,
              ts_probability: s.ts_probability,
              ts_predicted: s.ts_predicted,
              threshold: s.threshold,
              icon: s.slot === 0 ? "🌙" : s.slot === 1 ? "☀️" : s.slot === 2 ? "⛅" : "🌆"
            })));
          }
        } catch (err) {
          setIsLiveData(false);
          setLastUpdated('2026-07-25 17:20 IST');
          setCurrentSlots(DEFAULT_SLOTS);
        }
      };

      useEffect(() => {
        fetchRealForecast();
        const interval = setInterval(fetchRealForecast, 300000);
        return () => clearInterval(interval);
      }, []);

      // IST Clock Ticker
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          const ist = new Date(utc + (3600000 * 5.5));
          setLiveTime(ist.toLocaleTimeString('en-US', { hour12: false }) + ' IST');

        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);

      const handleNavTabClick = (tab) => {

        if (tab === 'ATC VIEW') setIsAtcMode(true);
        else setIsAtcMode(false);
      };

        setIsAtcMode(false);
        setActiveNavTab('DASHBOARD');

            style={{

              opacity: selectedSlotIndex === 0 ? 1 : 0

          <div

            style={{
              backgroundImage: `url('./morning1.png')`,

            }}
          />

            style={{

            }}

            <AtcViewFullscreen 
              currentSlot={currentSlots[selectedSlotIndex]} 
              onExitAtc={handleExitAtc}
            />
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
