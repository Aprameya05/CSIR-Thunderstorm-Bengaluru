name: Update Forecast JSON

on:
  schedule:
    - cron: '15 4,10,16,22 * * *'
  workflow_dispatch:

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy joblib scikit-learn xgboost requests

      - name: Run forecast pipeline
        run: python forecast_action.py

      - name: Commit and push forecast.json
        run: |
          git config --global user.name "CSIR Forecast Bot"
          git config --global user.email "bot@csir-thunderstorm.in"
          git add forecast.json
          git diff --staged --quiet || git commit -m "auto: forecast update" && git push
